<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="after-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FE"/>
      <stop offset="100%" stop-color="#EAFDF5"/>
    </linearGradient>
    <linearGradient id="safe-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#066EEB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="green-glow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="blue-glow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#066EEB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="8" fill="url(#after-bg)"/>

  <!-- Highlighted Safe Path on Sidewalk -->
  <path d="M 30,230 L 370,230 L 360,290 L 10,290 Z" fill="url(#safe-path)"/>
  
  <!-- Path boundary lines -->
  <line x1="30" y1="230" x2="370" y2="230" stroke="#10B981" stroke-width="2" opacity="0.6"/>
  <line x1="10" y1="290" x2="360" y2="290" stroke="#10B981" stroke-width="3" opacity="0.8"/>

  <!-- Sidewalk lines (soft) -->
  <line x1="150" y1="230" x2="120" y2="290" stroke="#BDCFE8" stroke-width="1.5" opacity="0.5"/>
  <line x1="270" y1="230" x2="250" y2="290" stroke="#BDCFE8" stroke-width="1.5" opacity="0.5"/>

  <!-- Character: Blind Person (Confident, standing straight, wearing SafeEye) -->
  <g transform="translate(60, 70)" filter="url(#blue-glow)">
    <!-- Head -->
    <circle cx="45" cy="40" r="12" fill="#1F2937"/>
    <!-- Glasses/Wearable SafeEye device (with cyan glow) -->
    <rect x="33" cy="36" width="12" height="6" rx="2" fill="#00FFCC"/>
    <circle cx="36" cy="39" r="2" fill="#FFFFFF"/>
    
    <!-- Body -->
    <path d="M 45,52 C 35,52 30,65 30,85 L 30,125 C 30,130 35,135 40,135 L 42,135 L 40,175 C 40,180 46,180 48,175 L 51,135 L 53,175 C 53,180 59,180 61,175 L 59,135 L 60,135 C 65,135 70,130 70,125 L 70,85 C 70,65 65,52 45,52 Z" fill="#1F2937"/>
    
    <!-- Arm relaxed by the side (holding cane upright, not sweeping frantically) -->
    <path d="M 55,65 L 63,95 L 58,115" fill="none" stroke="#1F2937" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cane held confidently upright/folded or relaxed -->
    <line x1="58" y1="115" x2="52" y2="180" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Device on Shoulder/Chest emitting signal -->
    <circle cx="36" cy="62" r="5" fill="#066EEB"/>
    <circle cx="36" cy="62" r="2" fill="#00FFCC"/>
  </g>

  <!-- AI Radar Scanning Waves -->
  <path d="M 120,120 A 40,40 0 0,1 120,150" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 140,105 A 70,70 0 0,1 140,165" fill="none" stroke="#066EEB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 165,90 A 100,100 0 0,1 165,180" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 195,75 A 130,130 0 0,1 195,195" fill="none" stroke="#066EEB" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Detected obstacles -->
  
  <!-- Obstacle 1: Pothole detected (marked in green bounding box) -->
  <g transform="translate(205, 235)" filter="url(#green-glow)">
    <ellipse cx="25" cy="10" rx="25" ry="8" fill="#1F2937"/>
    <!-- Detection box / highlights -->
    <ellipse cx="25" cy="10" rx="28" ry="11" fill="none" stroke="#10B981" stroke-width="2"/>
    <!-- Mini label -->
    <rect x="5" y="-12" width="40" height="12" rx="3" fill="#10B981"/>
    <text x="9" y="-3" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="8">VẬT CẢN</text>
  </g>

  <!-- Obstacle 2: Scooter detected (marked with green bounding/safety overlay) -->
  <g transform="translate(280, 130)" filter="url(#green-glow)">
    <!-- Scooter silhouette -->
    <path d="M 10,95 C 10,95 5,85 5,75 C 5,60 20,50 35,50 L 50,55 C 50,55 55,30 65,15 C 70,5 85,5 85,5 L 88,15 L 75,25 L 75,55 L 90,65 C 95,70 95,85 90,95 Z" fill="#374151" opacity="0.8"/>
    <circle cx="20" cy="95" r="14" fill="#111827"/>
    <circle cx="80" cy="95" r="14" fill="#111827"/>
    
    <!-- AI Green detection box -->
    <rect x="-2" y="3" width="98" height="106" rx="6" fill="none" stroke="#10B981" stroke-width="2"/>
    <rect x="-2" y="-12" width="55" height="15" rx="3" fill="#10B981"/>
    <text x="3" y="0" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="9">XE MÁY 1.2M</text>
  </g>

  <!-- Safe Check Icon on top left of scooter -->
  <g transform="translate(260, 100)" filter="url(#green-glow)">
    <circle cx="12" cy="12" r="12" fill="#10B981"/>
    <path d="M 7,12 L 10,15 L 17,8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
